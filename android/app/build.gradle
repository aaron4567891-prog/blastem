def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    if (buildAsApplication) {
        namespace "com.retrodev.blastem"
    }
    compileSdkVersion 35
    ndkVersion "27.0.12077973"
    sourceSets.main {
        java.setSrcDirs(["src/main/java/com", "jni/SDL/android-project/app/src/main/java"])
        assets.setSrcDirs(["build/generated/blastemAssets"])
    }
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21"
                abiFilters 'arm64-v8a'
            }
            // cmake {
            //     arguments "-DANDROID_APP_PLATFORM=android-21", "-DANDROID_STL=c++_static"
            //     // abiFilters 'arm64-v8a'
            //     abiFilters 'arm64-v8a'
            // }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
            // cmake {
            //     path 'jni/CMakeLists.txt'
            // }
        }
       
    }
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

// Run once after cloning/pulling, before Gradle configures native sources.
tasks.register('checkAndroidSetup') {
    doLast {
        if (!file('jni/SDL/include/SDL.h').exists() ||
            !file('../../m68k.c').exists() ||
            !file('build/generated/blastemAssets/default.cfg').exists()) {
            throw new GradleException('Run python android/setup.py from the repository root first.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn('checkAndroidSetup') }
